<header
      class="fixed top-0 left-0 right-0 z-50 glass border-b border-[#1E293B] dark:border-[#1E293B]"
    >
      <nav
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8"
        aria-label="Main navigation"
      >
        <div class="flex items-center justify-between h-16">
          <!-- Logo -->
          <a
            href="#home"
            class="flex items-center gap-2 group"
            aria-label="Ali Hamza - Home"
          >
            <span class="text-xl font-bold tracking-tight">
              <span class="text-[#10B981]">AH</span
              ><span class="text-[#94A3B8]">.</span>
            </span>
          </a>

          <!-- Desktop Nav Links -->
          <div class="hidden md:flex items-center gap-1">
            <a
              href="#about"
              class="nav-link px-3 py-2 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] transition-colors rounded-md"
              data-section="about"
              >About</a
            >
            <a
              href="#skills"
              class="nav-link px-3 py-2 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] transition-colors rounded-md"
              data-section="skills"
              >Skills</a
            >
            <a
              href="#projects"
              class="nav-link px-3 py-2 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] transition-colors rounded-md"
              data-section="projects"
              >Projects</a
            >
            <a
              href="#experience"
              class="nav-link px-3 py-2 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] transition-colors rounded-md"
              data-section="experience"
              >Experience</a
            >
            <a
              href="#education"
              class="nav-link px-3 py-2 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] transition-colors rounded-md"
              data-section="education"
              >Education</a
            >
            <a
              href="#contact"
              class="nav-link px-3 py-2 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] transition-colors rounded-md"
              data-section="contact"
              >Contact</a
            >
          </div>

          <!-- Right side: Theme toggle + Contact Us -->
          <div class="flex items-center gap-2">
            <!-- Theme Toggle -->
            <button
              id="themeToggle"
              class="p-2 rounded-lg text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-white/5 transition-colors"
              aria-label="Toggle theme"
            >
              <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
              <i data-lucide="sun" class="w-5 h-5 block dark:hidden"></i>
            </button>

            <!-- Contact Us CTA -->
            <a
              href="#contact"
              class="hidden sm:inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-[#0A0A0A] bg-[#10B981] hover:bg-[#0ea572] rounded-lg transition-colors"
            >
              <i data-lucide="send" class="w-4 h-4"></i>
              Contact Us
            </a>

            <!-- Hamburger -->
            <button
              id="hamburger"
              class="hamburger md:hidden flex flex-col justify-center items-center w-10 h-10 gap-1.5 rounded-lg hover:bg-white/5 transition-colors"
              aria-label="Toggle menu"
              aria-expanded="false"
            >
              <span
                class="hamburger-line line-1 block w-5 h-0.5 bg-[#F8FAFC] rounded"
              ></span>
              <span
                class="hamburger-line line-2 block w-5 h-0.5 bg-[#F8FAFC] rounded"
              ></span>
              <span
                class="hamburger-line line-3 block w-5 h-0.5 bg-[#F8FAFC] rounded"
              ></span>
            </button>
          </div>
        </div>

        <!-- Mobile Menu -->
        <div id="mobileMenu" class="mobile-menu md:hidden">
          <div class="py-4 space-y-1 border-t border-[#1E293B]">
            <a
              href="#about"
              class="mobile-link block px-3 py-3 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-white/5 rounded-lg transition-colors"
              >About</a
            >
            <a
              href="#skills"
              class="mobile-link block px-3 py-3 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-white/5 rounded-lg transition-colors"
              >Skills</a
            >
            <a
              href="#projects"
              class="mobile-link block px-3 py-3 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-white/5 rounded-lg transition-colors"
              >Projects</a
            >
            <a
              href="#experience"
              class="mobile-link block px-3 py-3 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-white/5 rounded-lg transition-colors"
              >Experience</a
            >
            <a
              href="#education"
              class="mobile-link block px-3 py-3 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-white/5 rounded-lg transition-colors"
              >Education</a
            >
            <a
              href="#contact"
              class="mobile-link block px-3 py-3 text-sm font-medium text-[#94A3B8] hover:text-[#F8FAFC] hover:bg-white/5 rounded-lg transition-colors"
              >Contact</a
            >
            <a
              href="#contact"
              class="mobile-link mobile-cta flex items-center justify-center gap-2 mt-3 px-4 py-3 text-sm font-semibold text-[#0A0A0A] bg-[#10B981] hover:bg-[#0ea572] rounded-lg transition-colors"
            >
              <i data-lucide="send" class="w-4 h-4"></i>
              Contact Us
            </a>
          </div>
        </div>
      </nav>
    </header>
